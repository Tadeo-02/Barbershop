services:
  - type: web
    name: barbershop-backend
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm exec prisma generate && pnpm run build:backend
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: EMAIL_VERIFICATION_TOKEN_TTL_MINUTES
        sync: false
      - key: PASSWORD_RESET_TOKEN_TTL_MINUTES
        sync: false